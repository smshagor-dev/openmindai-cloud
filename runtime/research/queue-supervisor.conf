[program:openmind-research]
command=/usr/bin/php /srv/openmind/artisan queue:work database --queue=research --sleep=2 --tries=1 --timeout=440
numprocs=3
process_name=%(program_name)s_%(process_num)02d
user=www-data
autostart=true
autorestart=true
stopwaitsecs=480
redirect_stderr=true
stdout_logfile=/var/log/openmind-research.log
