name: Admin Developer API Keys validation

on:
  push:
    paths:
      - 'app/Http/Controllers/AdminDeveloperKeysController.php'
      - 'routes/web.php'
      - 'resources/views/admin/code-agents.blade.php'
      - 'public/js/admin-developer-keys.js'
      - 'tests/Feature/AdminDeveloperApiKeysTest.php'
      - '.github/workflows/admin-developer-keys.yml'
  pull_request:
    paths:
      - 'app/Http/Controllers/AdminDeveloperKeysController.php'
      - 'routes/web.php'
      - 'resources/views/admin/code-agents.blade.php'
      - 'public/js/admin-developer-keys.js'
      - 'tests/Feature/AdminDeveloperApiKeysTest.php'
      - '.github/workflows/admin-developer-keys.yml'

jobs:
  api-keys:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, curl, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan test --filter='AdminDeveloperApiKeysTest|RegisteredApplicationsTest|OpenMindAiGatewayTest|CloudApiAuthResponseTest'
      - run: php artisan route:cache && php artisan view:cache && php artisan config:cache
      - run: node --check public/js/admin-developer-keys.js
