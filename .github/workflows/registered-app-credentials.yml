name: Registered apps credentials validation
on:
  push:
    paths:
      - 'app/Http/Controllers/CodeAgentsAdminController.php'
      - 'routes/web.php'
      - 'resources/views/admin/code-agents.blade.php'
      - 'public/js/admin-first-party-apps.js'
      - 'tests/Feature/RegisteredApplicationsTest.php'
      - '.github/workflows/registered-app-credentials.yml'
  pull_request:
    paths:
      - 'app/Http/Controllers/CodeAgentsAdminController.php'
      - 'routes/web.php'
      - 'resources/views/admin/code-agents.blade.php'
      - 'public/js/admin-first-party-apps.js'
      - 'tests/Feature/RegisteredApplicationsTest.php'
      - '.github/workflows/registered-app-credentials.yml'
jobs:
  credentials:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, curl, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan test --filter='RegisteredApplicationsTest|OpenMindAiGatewayTest|CloudApiAuthResponseTest'
      - run: php artisan route:cache && php artisan view:cache && php artisan config:cache
      - run: node --check public/js/admin-first-party-apps.js
