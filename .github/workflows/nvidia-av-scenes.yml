name: NVIDIA AV scene ZIP contract
on:
  push:
    paths:
      - 'app/Http/Controllers/NvidiaAvSceneController.php'
      - 'app/Jobs/RunAvSceneInference.php'
      - 'database/migrations/2026_10_21_000013_av_scene_jobs.php'
      - 'database/migrations/2026_10_21_000014_configure_streampetr.php'
      - 'routes/api.php'
      - 'tests/Feature/NvidiaAvSceneTest.php'
      - '.github/workflows/nvidia-av-scenes.yml'
  pull_request:
    paths:
      - 'app/Http/Controllers/NvidiaAvSceneController.php'
      - 'app/Jobs/RunAvSceneInference.php'
      - 'database/migrations/2026_10_21_000013_av_scene_jobs.php'
      - 'database/migrations/2026_10_21_000014_configure_streampetr.php'
      - 'routes/api.php'
      - 'tests/Feature/NvidiaAvSceneTest.php'
      - '.github/workflows/nvidia-av-scenes.yml'
jobs:
  av-scenes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, curl, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan test --filter='NvidiaAvSceneTest|NvidiaSpecialistCatalogTest|NvidiaInferenceRoutesTest'
      - run: php artisan route:cache && php artisan view:cache && php artisan config:cache
