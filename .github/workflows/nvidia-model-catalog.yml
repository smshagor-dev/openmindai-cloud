name: NVIDIA model catalog contract

on:
  push:
    branches:
      - feature/always-visible-nvidia-models
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, curl, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan test --filter='NvidiaModelCatalogAdminTest|OpenMindAiGatewayTest|CloudApiAuthResponseTest'
      - run: php artisan route:cache && php artisan view:cache && php artisan config:cache
