name: 3D Studio contracts
on:
  push:
    branches: [feature/3d-studio, release/3d-studio-deployment]
  pull_request:
    paths:
      - 'app/Http/Controllers/SceneStudioController.php'
      - 'app/Services/StudioScene.php'
      - 'database/migrations/*studio_scenes.php'
      - 'tests/Feature/SceneStudioTest.php'
      - '.github/workflows/3d-studio.yml'
jobs:
  scene-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, curl, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan test --filter=SceneStudioTest
      - name: Verify feature formatting
        run: |
          vendor/bin/pint app/Http/Controllers/SceneStudioController.php app/Services/StudioScene.php database/migrations/2026_10_28_000001_create_studio_scenes.php tests/Feature/SceneStudioTest.php routes/api.php
          git diff --exit-code
