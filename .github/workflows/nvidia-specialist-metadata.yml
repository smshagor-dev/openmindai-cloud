name: NVIDIA specialist metadata validation
on:
  push:
    paths:
      - 'config/nvidia_specialists.php'
      - 'app/Services/HostedCodeAgents.php'
      - 'app/Http/Controllers/CodeAgentsAdminController.php'
      - 'resources/views/admin/nvidia-models.blade.php'
      - 'tests/Feature/NvidiaSpecialistCatalogTest.php'
      - '.github/workflows/nvidia-specialist-metadata.yml'
  pull_request:
    paths:
      - 'config/nvidia_specialists.php'
      - 'app/Services/HostedCodeAgents.php'
      - 'app/Http/Controllers/CodeAgentsAdminController.php'
      - 'resources/views/admin/nvidia-models.blade.php'
      - 'tests/Feature/NvidiaSpecialistCatalogTest.php'
      - '.github/workflows/nvidia-specialist-metadata.yml'
jobs:
  catalog:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, curl, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan test --filter='NvidiaSpecialistCatalogTest|NvidiaModelCatalogAdminTest|NvidiaInferenceRoutesTest|CosmosHostedGenerationTest'
      - run: php artisan route:cache && php artisan view:cache
