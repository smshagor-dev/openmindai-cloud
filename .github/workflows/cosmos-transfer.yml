name: Cosmos Transfer controlled video contract
on:
  push:
    paths:
      - 'app/Http/Controllers/NvidiaCosmosTransferController.php'
      - 'app/Jobs/RunCosmosTransfer.php'
      - 'config/cosmos_transfer.php'
      - 'database/migrations/2026_10_21_000016_cosmos_transfer_jobs.php'
      - 'tests/Feature/CosmosTransferTest.php'
      - '.github/workflows/cosmos-transfer.yml'
  pull_request:
    paths:
      - 'app/Http/Controllers/NvidiaCosmosTransferController.php'
      - 'app/Jobs/RunCosmosTransfer.php'
      - 'config/cosmos_transfer.php'
      - 'database/migrations/2026_10_21_000016_cosmos_transfer_jobs.php'
      - 'tests/Feature/CosmosTransferTest.php'
      - '.github/workflows/cosmos-transfer.yml'
jobs:
  transfer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, curl, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan test --filter='CosmosTransferTest|CosmosHostedGenerationTest|NvidiaSpecialistCatalogTest'
      - run: php artisan route:cache && php artisan view:cache && php artisan config:cache
