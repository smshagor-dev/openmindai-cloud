name: Magpie TTS synthesis contract
on:
  push:
    paths:
      - 'app/Http/Controllers/NvidiaMagpieController.php'
      - 'app/Jobs/RunMagpieSynthesis.php'
      - 'config/magpie.php'
      - 'database/migrations/2026_10_21_000018_magpie_generations.php'
      - 'database/migrations/2026_10_21_000019_enable_magpie_speech_nim.php'
      - 'tests/Feature/MagpieSynthesisTest.php'
      - '.github/workflows/magpie-tts.yml'
  pull_request:
    paths:
      - 'app/Http/Controllers/NvidiaMagpieController.php'
      - 'app/Jobs/RunMagpieSynthesis.php'
      - 'config/magpie.php'
      - 'database/migrations/2026_10_21_000018_magpie_generations.php'
      - 'database/migrations/2026_10_21_000019_enable_magpie_speech_nim.php'
      - 'tests/Feature/MagpieSynthesisTest.php'
      - '.github/workflows/magpie-tts.yml'
jobs:
  tts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, curl, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan test --filter='MagpieSynthesisTest|NvidiaSpecialistCatalogTest|NvidiaModelCatalogAdminTest'
      - run: php artisan route:cache && php artisan view:cache && php artisan config:cache
