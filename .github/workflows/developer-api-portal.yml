name: Developer Portal

on:
  push:
    paths:
      - 'Api/**'
      - 'app/Http/Controllers/DeveloperPortalController.php'
      - 'routes/api.php'
      - '.github/workflows/developer-api-portal.yml'
  pull_request:
    paths:
      - 'Api/**'
      - 'app/Http/Controllers/DeveloperPortalController.php'
      - 'routes/api.php'
      - '.github/workflows/developer-api-portal.yml'

jobs:
  portal:
    name: Next.js build and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Gateway integration tests
        run: npm run test:integration
