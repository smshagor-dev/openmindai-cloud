name: Hosted media callback validation
on:
  push:
    paths:
      - 'app/Providers/AppServiceProvider.php'
      - 'routes/api.php'
      - 'tests/Feature/MediaTest.php'
      - '.github/workflows/media-callback.yml'
  pull_request:
    paths:
      - 'app/Providers/AppServiceProvider.php'
      - 'routes/api.php'
      - 'tests/Feature/MediaTest.php'
      - '.github/workflows/media-callback.yml'
jobs:
  media:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, curl, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan test --filter='MediaTest|CosmosHostedGenerationTest'
      - run: php artisan route:cache
