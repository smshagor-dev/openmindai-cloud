name: VoiceChat realtime session contract
on:
  push:
    paths:
      - 'app/Http/Controllers/NvidiaVoiceChatController.php'
      - 'config/voicechat.php'
      - 'database/migrations/2026_10_21_000020_voicechat_sessions.php'
      - 'database/migrations/2026_10_21_000021_enable_voicechat_realtime.php'
      - 'runtime/voicechat/**'
      - 'tests/Feature/VoiceChatSessionTest.php'
      - '.github/workflows/voicechat-realtime.yml'
  pull_request:
    paths:
      - 'app/Http/Controllers/NvidiaVoiceChatController.php'
      - 'config/voicechat.php'
      - 'database/migrations/2026_10_21_000020_voicechat_sessions.php'
      - 'database/migrations/2026_10_21_000021_enable_voicechat_realtime.php'
      - 'runtime/voicechat/**'
      - 'tests/Feature/VoiceChatSessionTest.php'
      - '.github/workflows/voicechat-realtime.yml'
jobs:
  laravel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, curl, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan test --filter='VoiceChatSessionTest|NvidiaSpecialistCatalogTest|NvidiaModelCatalogAdminTest'
      - run: php artisan route:cache && php artisan view:cache && php artisan config:cache
  realtime-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r runtime/voicechat/requirements.txt pytest
      - run: python -m pytest -q runtime/voicechat/test_server.py
      - run: python -m compileall -q runtime/voicechat
