name: Responsive frontend browsers
on:
  push:
    branches: [fix/frontend-responsive-audit, feature/3d-modly-capabilities]
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-responsive.yml']
concurrency:
  group: responsive-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: frontend
    env:
      RESPONSIVE_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node e2e/responsive-run.mjs
      - run: node e2e/studio-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-${{ matrix.browser }}
          path: frontend/test-results
          retention-days: 7
